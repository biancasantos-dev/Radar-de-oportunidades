<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OportUni | Acesso Docente</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/ID visual/icon.svg">
  
  <!-- Estilos: Global compartilhado e específico do Login -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- Barra de Navegação -->
  <header class="navbar">
    <div class="container navbar-inner">
      <a href="index.html" class="navbar-brand" aria-label="OportUni - Página Inicial">
        <img src="assets/img/ID visual/logotipo-principa.svg" alt="OportUni">
      </a>
      
      <button type="button" class="navbar-toggle" aria-label="Alternar menu de navegação">
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav class="navbar-nav" aria-label="Navegação principal">
        <a href="index.html" class="nav-link">Mural</a>
        <a href="sobre.html" class="nav-link">Sobre</a>
        <a href="login.html" class="nav-btn-professor" aria-current="page">
          <img src="assets/icons/user.svg" alt="" aria-hidden="true" width="15" height="15">
          <span>Área do Professor</span>
        </a>
      </nav>
    </div>
  </header>

  <!-- Conteúdo Principal: Autenticação Docente -->
  <main class="page-content container login-page-wrap">
    
    <div class="login-container">
      
      <!-- Cartão Principal de Login -->
      <section class="login-card" aria-labelledby="login-title">
        
        <!-- Cabeçalho do Card -->
        <header class="login-card-header">
          <div class="login-badge-row">
            <span class="login-badge-role">Portal do Docente</span>
            <span class="login-badge-uni">UCSal 2026.2</span>
          </div>

          <h1 class="login-title" id="login-title">
            Bem-vindo(a), <mark class="title-highlight-purple">Professor(a)</mark>
          </h1>
          <p class="login-subtitle">
            Acesse para publicar novos editais, gerenciar vagas acadêmicas e avaliar candidaturas discentes.
          </p>
        </header>

        <!-- Mensagens de Alerta (Feedback dinâmico) -->
        <div id="login-feedback" class="login-feedback hidden" role="alert" aria-live="polite">
          <span class="feedback-icon" id="feedback-icon" aria-hidden="true"></span>
          <span class="feedback-text" id="feedback-text"></span>
        </div>

        <!-- Formulário de Autenticação -->
        <form id="form-login" class="login-form" novalidate>
          
          <div class="form-group">
            <label for="email" class="form-label">E-mail Institucional</label>
            <div class="input-icon-wrap">
              <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </svg>
              <input 
                type="email" 
                id="email" 
                name="email" 
                class="form-input" 
                placeholder="nome.docente@ucsal.br" 
                required 
                autocomplete="username"
              >
            </div>
          </div>

          <div class="form-group">
            <div class="form-label-row">
              <label for="senha" class="form-label">Senha de Acesso</label>
              <a href="#" class="forgot-link" id="link-esqueci-senha" tabindex="0">Esqueceu a senha?</a>
            </div>
            <div class="input-icon-wrap">
              <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input 
                type="password" 
                id="senha" 
                name="senha" 
                class="form-input" 
                placeholder="Digite sua senha" 
                required 
                autocomplete="current-password"
              >
              <button type="button" class="btn-toggle-pass" id="btn-toggle-pass" aria-label="Mostrar ou ocultar senha">
                <svg class="eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="eye-hide hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="form-checkbox-row">
            <label class="checkbox-label" for="lembrar">
              <input type="checkbox" id="lembrar" name="lembrar" class="checkbox-input">
              <span class="checkbox-custom" aria-hidden="true"></span>
              <span class="checkbox-text">Manter sessão conectada</span>
            </label>
          </div>

          <button type="submit" class="btn-login" id="btn-submit-login">
            <span class="btn-text">Entrar no Painel</span>
            <svg class="btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="5" y1="12" x2="19" y2="12"></line>
              <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
            <span class="spinner hidden" id="login-spinner" aria-hidden="true"></span>
          </button>

        </form>

        <footer class="login-card-footer">
          <a href="index.html" class="back-link">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="19" y1="12" x2="5" y2="12"></line>
              <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            <span>Voltar ao Mural de Oportunidades</span>
          </a>
        </footer>

      </section>

    </div>

  </main>

  <!-- Rodapé Institucional -->
  <footer class="footer">
    <div class="container footer-content">
      <figure class="footer-brand">
        <img src="assets/img/ID visual/logo-l.svg" alt="" width="26" height="26">
        <figcaption class="footer-text">OportUni &copy; 2026 — Disciplina POOA | UCSal</figcaption>
      </figure>
      <nav class="footer-links" aria-label="Links institucionais">
        <a href="index.html">Mural de Vagas</a>
        <a href="sobre.html">Sobre o Projeto</a>
      </nav>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="js/script.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
